<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#4a55a8"/>
<title>BLOCK THUD!</title>
<!-- v44 : Line Clear System — 22 profils matières (gel + 21) intégrés au moteur.
     Timeline : anticipation / flash / vague / destruction / lumière / ombre /
     particules pool 250 / gravité différée / squash impact. Aucun shadowBlur. -->
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@800;900&family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet"/>
<style>
:root{--panel:rgba(255,255,255,.10);--panel2:rgba(255,255,255,.17);--line:rgba(255,255,255,.15);--ink:#fff;--dim:rgba(255,255,255,.80);--gold:#ffd23d;--gold-d:#c9a41f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}html,body{height:100%}
body{background:#4a55a8;color:var(--ink);font-family:'Fredoka',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:80;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(8,10,28,.40) 100%)}
#bgFx{position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity .9s,background .9s}
#glow{position:fixed;inset:0;z-index:79;pointer-events:none;opacity:0;transition:opacity .6s;box-shadow:inset 0 0 90px 24px rgba(255,120,40,.55)}
#flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.5),rgba(255,255,255,0) 62%)}
#flash.go{animation:flashA .35s ease-out}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}
#fxBack{position:fixed;inset:0;pointer-events:none;z-index:1}
#app{position:relative;z-index:2;max-width:470px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:60px}
.hside{width:104px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.hside.right{align-items:flex-end}
#bestWrap{display:flex;align-items:center;gap:6px;color:var(--gold);font-size:27px;font-weight:800;margin-top:2px;font-family:'Nunito Sans','Fredoka',sans-serif;text-shadow:0 3.6px 8px rgba(90,64,8,.60),0 1.2px 0 rgba(169,126,18,.80)}
#bestWrap svg{width:36px;height:36px;fill:currentColor;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
#btnPause{background:none;border:none;padding:2px;margin-top:0;cursor:pointer;line-height:0}
#btnPause svg{width:44px;height:44px}
#btnPause img{width:48px;height:48px}
#score{display:none}
.score-wrap{text-align:center;line-height:1;flex:1;position:relative;z-index:110;min-height:12px}
#objBar{display:none;align-items:center;gap:8px;padding:8px 10px 0}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .45s}
#objTxt{font-size:13.5px;font-weight:600;white-space:nowrap}
#objPieces{font-size:12.5px;color:var(--dim);white-space:nowrap}
#topSpacer{flex:1}
#boardWrap{flex:0 0 auto;position:relative;display:grid;place-items:center;min-height:0;margin-top:4px}
#board{display:block}
#tray{display:flex;gap:10px;padding:0 0 6px;margin-top:36px}
#botSpacer{flex:1}
.slot{flex:1;height:120px;display:grid;place-items:center;touch-action:none;background:transparent;border:none;box-shadow:none}
.slot canvas{cursor:grab;touch-action:none}
.slot.dead canvas{opacity:.9}
.slot.spawn{animation:slotIn .26s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes slotIn{from{opacity:0;transform:scale(.55)}}
#dragLayer{position:fixed;left:0;top:0;display:none;pointer-events:none;z-index:50}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:60}
.tp{position:fixed;width:4px;height:4px;border-radius:2px;background:#fff;box-shadow:0 0 4px #fff;z-index:65;pointer-events:none;animation:tpPop .38s ease-out forwards}
@keyframes tpPop{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(1.5) translateY(-9px)}}
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(24,29,66,.74);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.overlay.show{opacity:1;pointer-events:auto}
.panel{width:min(100%,352px);max-height:calc(100dvh - 36px);overflow:auto;background:#2b3157;border:1px solid rgba(255,255,255,.10);border-radius:26px;padding:26px 22px;text-align:center;transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.34,1.3,.64,1);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.overlay.show .panel{transform:none}
.btn3d{display:flex;align-items:center;justify-content:center;gap:12px;border:none;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;color:#fff;border-radius:16px;padding:15px 18px;width:100%;margin-bottom:14px;position:relative;text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .07s,box-shadow .07s}
.btn3d .ico{width:26px;height:26px;flex:none;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.btn3d.green{background:linear-gradient(180deg,#5BD964,#2FBF4F);box-shadow:0 6px 0 #1F9440,0 10px 16px rgba(0,0,0,.28)}
.btn3d.green:active{transform:translateY(5px);box-shadow:0 1px 0 #1F9440}
.btn3d.orange{background:linear-gradient(180deg,#FFB53D,#F59310);box-shadow:0 6px 0 #C67207,0 10px 16px rgba(0,0,0,.28)}
.btn3d.orange:active{transform:translateY(5px);box-shadow:0 1px 0 #C67207}
.btn3d.blue{background:linear-gradient(180deg,#6B8CFF,#4a6ae0);box-shadow:0 6px 0 #3550bd,0 10px 16px rgba(0,0,0,.28)}
.btn3d.blue:active{transform:translateY(5px);box-shadow:0 1px 0 #3550bd}
.btn3d.ghost{background:linear-gradient(180deg,#8a90b8,#6a7098);box-shadow:0 6px 0 #4a5078,0 10px 16px rgba(0,0,0,.25)}
.btn3d.ghost:active{transform:translateY(5px);box-shadow:0 1px 0 #4a5078}
.btn3d:disabled{opacity:.5;pointer-events:none}
#ovLoad{z-index:150;background:linear-gradient(180deg,#5a67b8 0%,#4a55a8 100%);backdrop-filter:none}
#ovLoad .panel,#ovTitle .panel{background:transparent;border:none;box-shadow:none;overflow:visible;max-height:none}
.loadBar{width:210px;height:14px;border-radius:99px;background:rgba(255,255,255,.22);margin:30px auto 0;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.loadBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFD23D,#FFA53D);border-radius:99px;transition:width .18s}
.bigLogo{text-align:center;margin-top:2px;user-select:none}
.bigLogo .row{display:flex;justify-content:center;gap:6px}
.bigLogo span{display:inline-flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:700;color:#fff;font-size:44px;width:52px;height:56px;border-radius:13px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.30),0 6px 0 rgba(0,0,0,.30);transform:rotate(var(--r));animation:floaty 3.4s ease-in-out infinite}
.bigLogo .crown{width:56px;height:40px;margin:0 auto -8px;fill:var(--gold);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));position:relative;z-index:2}
.bigLogo .tag{color:rgba(255,255,255,.85);font-weight:600;font-size:15px;letter-spacing:3px;margin-top:12px;text-transform:uppercase}
@keyframes floaty{50%{transform:rotate(var(--r)) translateY(-4px)}}
#ovTitle{background:linear-gradient(180deg,#5a67b8 0%,#3f4a98 100%);backdrop-filter:none}
.bestScoreWrap{text-align:center;margin:18px 0 6px;cursor:pointer}
.bestScoreWrap .cr{width:44px;height:34px;fill:var(--gold);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.bestScoreWrap .lbl{font-family:'Nunito Sans',sans-serif;font-weight:900;font-size:30px;color:var(--gold);text-shadow:0 6px 16px rgba(90,64,8,.55),0 2.4px 0 rgba(169,126,18,.80);margin-top:2px}
.titleBtns{margin-top:22px}
.miniStats{color:var(--dim);font-size:12.5px;margin-top:14px;white-space:pre-line}
#btnResume{margin-top:4px}
#ovPause .panel{background:linear-gradient(180deg,#5B7BD8,#4660c4);border:1px solid rgba(255,255,255,.22);position:relative}
.pTitle{font-size:27px;font-weight:600;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);margin-bottom:14px}
.pClose{position:absolute;top:10px;right:14px;background:none;border:none;color:rgba(255,255,255,.85);font-size:30px;line-height:1;cursor:pointer;font-family:'Fredoka'}
.tgRow{display:flex;justify-content:space-around;background:rgba(255,255,255,.13);border-radius:18px;padding:14px 8px 10px;margin-bottom:16px}
.tgl{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:#fff;font-size:13.5px;font-weight:600;flex:1}
.tgl svg{width:32px;height:32px;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.tgl.off svg{opacity:.35}
.tgl .slash{stroke:#ff4b4b;stroke-width:3}
#ovOver{background:linear-gradient(180deg,#4a5fd8 0%,#2c3aa0 100%);backdrop-filter:none}
#ovOver .panel{background:transparent;border:none;box-shadow:none}
#foTitle{font-size:36px;font-weight:700;color:#fff;letter-spacing:1px;text-shadow:0 3px 0 #2c3aa0,0 4px 0 rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.35)}
#foScore{font-size:60px;font-weight:900;font-family:'Nunito Sans',sans-serif;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.22),0 8px 16px rgba(0,0,0,.3)}
#foBadge{display:none;margin:8px auto;width:max-content;background:var(--gold);color:#141420;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:6px 16px;border-radius:99px;animation:bump .5s ease infinite;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#foBadge.on{display:block}
@keyframes bump{50%{transform:scale(1.09)}}
#foStats{color:rgba(255,255,255,.85);font-size:13.5px;margin:14px 0 18px;line-height:1.55;white-space:pre-line}
#ovOver .fo-crown{display:none}
#ovOver.rec .fo-crown{display:block;width:54px;height:42px;margin:0 auto 2px;fill:var(--gold);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.wstars{display:flex;justify-content:center;gap:10px;margin:10px 0 4px}
.wstars svg{width:44px;height:44px;fill:rgba(255,255,255,.18);transform:scale(.5);opacity:.4;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.wstars svg.on{fill:var(--gold);transform:scale(1);opacity:1}
.fo-score{font-size:52px;font-weight:700;line-height:1.1;font-family:'Nunito Sans',sans-serif}
.adBox{width:100%;height:110px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;margin-bottom:14px;color:var(--dim);font-size:13px}
#adTxt{font-size:17px;font-weight:600;margin-bottom:12px}
#lvGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 10px}
.lvbtn{aspect-ratio:1;border:none;border-radius:15px;background:rgba(255,255,255,.10);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .1s;padding:2px}
.lvbtn:active{transform:scale(.92)}
.lvbtn .st{font-size:10px;letter-spacing:1px;color:var(--gold)}
.lvbtn.locked{opacity:.4;cursor:not-allowed}
.lvbtn.done{background:rgba(255,210,61,.18)}
#devStyle{width:100%;margin-top:8px;padding:8px;border-radius:10px;background:#1c2040;color:#fff;border:1px solid rgba(255,255,255,.2);font-family:inherit;font-size:13px}
#toast{position:fixed;left:50%;bottom:150px;z-index:200;transform:translateX(-50%) translateY(12px);background:#2b3157;border:1px solid rgba(255,255,255,.14);padding:10px 18px;border-radius:14px;font-size:14.5px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#fatalMsg{display:none;position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#5a1620;color:#fff;border:1px solid #ff8a8a;border-radius:10px;padding:10px;font:12px/1.4 monospace;word-break:break-all;pointer-events:none}
.cf{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;z-index:120;pointer-events:none;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-4vh) rotate(0)}to{transform:translateY(110vh) rotate(680deg)}}
</style>
</head>
<body>
<div id="bgFx"></div>
<div id="glow"></div>
<div id="flash"></div>
<div id="app">
  <header>
    <div class="hside">
      <div id="bestWrap">
        <svg viewBox="0 0 24 24"><path d="M3.4 8.2c.5-.5 1.3-.4 1.7.1l2.8 3.4 3-5.6c.4-.8 1.6-.8 2 0l3 5.6 2.8-3.4c.4-.5 1.2-.6 1.7-.1.4.3.5.9.4 1.4l-1.5 6.6c-.1.6-.6 1-1.2 1H5.7c-.6 0-1.1-.4-1.2-1L3 9.6c-.1-.5 0-1.1.4-1.4z"/></svg>
        <span id="bestVal">0</span>
      </div>
    </div>
    <div class="score-wrap">
      <div id="score">0</div>
    </div>
    <div class="hside right">
      <button id="btnPause" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.6v2.7M12 18.7v2.7M2.6 12h2.7M18.7 12h2.7M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/></svg>
      </button>
    </div>
  </header>
  <div id="objBar">
    <span id="objTxt"></span>
    <span class="bar"><i id="objFill"></i></span>
    <span id="objPieces"></span>
  </div>
  <div id="topSpacer"></div>
  <main id="boardWrap">
    <canvas id="board"></canvas>
  </main>
  <footer id="tray">
    <div class="slot"><canvas></canvas></div>
    <div class="slot"><canvas></canvas></div>
    <div class="slot"><canvas></canvas></div>
  </footer>
  <div id="botSpacer"></div>
</div>
<canvas id="fxBack"></canvas>
<canvas id="dragLayer"></canvas>
<canvas id="fxLayer"></canvas>
<div class="overlay show" id="ovLoad">
  <div class="panel">
    <div class="bigLogo">
      <svg class="crown" viewBox="0 0 24 24"><path d="M3.4 8.2c.5-.5 1.3-.4 1.7.1l2.8 3.4 3-5.6c.4-.8 1.6-.8 2 0l3 5.6 2.8-3.4c.4-.5 1.2-.6 1.7-.1.4.3.5.9.4 1.4l-1.5 6.6c-.1.6-.6 1-1.2 1H5.7c-.6 0-1.1-.4-1.2-1L3 9.6c-.1-.5 0-1.1.4-1.4z"/></svg>
      <div class="row">
        <span style="--r:-4deg;background:#FF5757">B</span><span style="--r:3deg;background:#FFA53D">L</span><span style="--r:-3deg;background:#FFD53D">O</span><span style="--r:4deg;background:#5DDC6A">C</span><span style="--r:-4deg;background:#3DC9EC">K</span>
      </div>
      <div class="row" style="margin-top:8px">
        <span style="--r:3deg;background:#FF5757">T</span><span style="--r:-3deg;background:#5DDC6A">H</span><span style="--r:4deg;background:#3DC9EC">U</span><span style="--r:-4deg;background:#FF5757">D</span><span style="--r:3deg;background:#FFD53D">!</span>
      </div>
      <div class="tag">Gravity Puzzle</div>
    </div>
    <div class="loadBar"><i id="loadFill"></i></div>
  </div>
</div>
<div class="overlay" id="ovTitle">
  <div class="panel">
    <div class="bigLogo">
      <svg class="crown" viewBox="0 0 24 24"><path d="M3.4 8.2c.5-.5 1.3-.4 1.7.1l2.8 3.4 3-5.6c.4-.8 1.6-.8 2 0l3 5.6 2.8-3.4c.4-.5 1.2-.6 1.7-.1.4.3.5.9.4 1.4l-1.5 6.6c-.1.6-.6 1-1.2 1H5.7c-.6 0-1.1-.4-1.2-1L3 9.6c-.1-.5 0-1.1.4-1.4z"/></svg>
      <div class="row">
        <span style="--r:-4deg;background:#FF5757">B</span><span style="--r:3deg;background:#FFA53D">L</span><span style="--r:-3deg;background:#FFD53D">O</span><span style="--r:4deg;background:#5DDC6A">C</span><span style="--r:-4deg;background:#3DC9EC">K</span>
      </div>
      <div class="row" style="margin-top:8px">
        <span style="--r:3deg;background:#FF5757">T</span><span style="--r:-3deg;background:#5DDC6A">H</span><span style="--r:4deg;background:#3DC9EC">U</span><span style="--r:-4deg;background:#FF5757">D</span><span style="--r:3deg;background:#FFD53D">!</span>
      </div>
      <div class="tag">Gravity Puzzle</div>
    </div>
    <div class="bestScoreWrap">
      <svg class="cr" viewBox="0 0 24 24"><path d="M3.4 8.2c.5-.5 1.3-.4 1.7.1l2.8 3.4 3-5.6c.4-.8 1.6-.8 2 0l3 5.6 2.8-3.4c.4-.5 1.2-.6 1.7-.1.4.3.5.9.4 1.4l-1.5 6.6c-.1.6-.6 1-1.2 1H5.7c-.6 0-1.1-.4-1.2-1L3 9.6c-.1-.5 0-1.1.4-1.4z"/></svg>
      <div class="lbl">Best Score!</div>
      <div class="lbl" id="titleBest" style="font-size:26px;color:#fff;text-shadow:0 5.2px 14px rgba(30,34,80,.75),0 2.1px 0 rgba(190,200,225,.70)">0</div>
    </div>
    <div class="titleBtns">
      <button class="btn3d orange" id="btnAdv"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-1 3v5l4 2 .8-1.6-3.3-1.6V8H11z"/></svg>Adventure</button>
      <button class="btn3d green" id="btnPlay"><svg class="ico" viewBox="0 0 24 24"><path d="M6.4 7.2a2 2 0 0 1 3-1.7l10 5.8a2 2 0 0 1 0 3.4l-10 5.8a2 2 0 0 1-3-1.7V7.2z"/></svg>Classic</button>
      <button class="btn3d blue" id="btnResume" style="display:none"><svg class="ico" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8h-2.5A5.5 5.5 0 1 1 12 6.5V9l4.5-3.5L12 2v2z"/></svg>Resume</button>
    </div>
    <p class="miniStats" id="titleStats"></p>
    <button class="btn3d ghost" id="btnDev" style="display:none;padding:10px;font-size:14px">🛠 DEV</button>
    <div id="devPanel" style="display:none">
      <p class="miniStats">Dev best: <b id="devBest">0</b></p>
      <div style="display:flex;gap:6px;justify-content:center">
        <button class="btn3d ghost" id="devM5" style="width:auto;padding:8px 12px;font-size:14px">-5k</button>
        <button class="btn3d ghost" id="devM1" style="width:auto;padding:8px 12px;font-size:14px">-1k</button>
        <button class="btn3d ghost" id="devP1" style="width:auto;padding:8px 12px;font-size:14px">+1k</button>
        <button class="btn3d ghost" id="devP5" style="width:auto;padding:8px 12px;font-size:14px">+5k</button>
      </div>
      <select id="devStyle"></select>
      <button class="btn3d ghost" id="devPreview" style="margin-top:8px;padding:10px;font-size:13px">Preview destruction</button>
      <button class="btn3d ghost" id="devUnlockAll" style="margin-top:8px;padding:10px;font-size:13px">Unlock all styles</button>
    </div>
  </div>
</div>
<div class="overlay" id="ovLevels">
  <div class="panel">
    <h2 class="fo-title" style="font-size:24px">Adventure</h2>
    <p style="color:var(--dim);font-size:13px;font-weight:600" id="advProg"></p>
    <div id="lvGrid"></div>
    <button class="btn3d ghost" id="btnMapBack">Back</button>
  </div>
</div>
<div class="overlay" id="ovWin">
  <div class="panel">
    <h2 class="fo-title" id="winTitle">Level cleared!</h2>
    <div class="wstars">

if(L.obj[0]==='lines')done=G.sessionLines>=L.obj[1];
else if(L.obj[0]==='gems')done=G.gems>=L.obj[1];
else if(L.obj[0]==='score')done=G.score>=L.obj[1];
if(!done)return;
G.playing=false;G.over=true;
const stars=G.score>=L.s3?3:(G.score>=L.s2?2:1);
if(stars>(G.advc[G.lvl]||0)){G.advc[G.lvl]=stars;saveState()}
if(G.score>G.best){G.best=G.score;checkUnlocks()}
saveState();
SFX.win();confetti(26);
 $('winTitle').textContent='Level cleared!';
 $('winScore').textContent=fmt(G.score);
 $('winStats').textContent=L.name+' · '+stars+'/3 ★ · Lines '+G.sessionLines;
for(let i=0;i<3;i++){
const el=$('ws'+i);
el.classList.remove('on');
if(i<stars)setTimeout(()=>{el.classList.add('on');SFX.gem()},400+i*350)}
show('ovWin')}
/* ================= ÉCRANS ================= */
function show(id){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));
if(id)$(id).classList.add('show')}
function hideAll(){show(null)}
function purgeFx(){
lcReset();falls.length=0;pops.length=0;
for(const k2 in squashMap)delete squashMap[k2];
drag=null;ghost=null;dragLayer.style.display='none';
G.acPending=false}
function startGame(mode,lvl){
purgeFx();
G.mode=mode;G.lvl=lvl||0;
G.score=0;G.shown=0;G.combo=0;G.bestCombo=0;G.sessionLines=0;G.gems=0;
G.over=false;G.pause=false;G.beatBest=false;G.lastTier=Math.floor(G.best/5000);
G.piecesSinceClear=0;G.revived=false;G.danger=false;
document.body.style.background='';
freshGrid();
const L=LEVELS[G.lvl];
if(mode==='adv'&&L&&L.preset){
L.preset.forEach((row,y)=>{for(let x=0;x<N;x++){
const ch=row[x]||'.';
if(ch==='.')return;
let ci=0,gem=0;
if(ch>='1'&&ch<='8')ci=+ch-1;
else if(ch>='A'&&ch<='H'){ci=ch.charCodeAt(0)-65;gem=1}
G.grid[y][x]={ci,gem}}})}
if(mode==='classic'){
let seed=0;
for(let y=5;y<N;y++)for(let x=0;x<N;x++)
if(Math.random()<.42)G.grid[y][x]={ci:Math.floor(Math.random()*8)}}
G.playing=true;
checkDanger();
refillTray();
updateBestHUD();
const ob=$('objBar');
if(mode==='adv'&&L){
ob.style.display='flex';
 $('objTxt').textContent=L.hint;
updateObjBar()}
else ob.style.display='none';
hideAll();
buildBoardBG()}
function updateObjBar(){
const L=LEVELS[G.lvl];if(!L)return;
let v=0,max=L.obj[1];
if(L.obj[0]==='lines')v=G.sessionLines;
else if(L.obj[0]==='gems')v=G.gems;
else if(L.obj[0]==='score')v=Math.min(G.score,max);
 $('objFill').style.width=Math.min(100,v/max*100)+'%';
 $('objPieces').textContent=Math.min(v,max)+'/'+max}
setInterval(()=>{if(G.playing&&G.mode==='adv')updateObjBar()},400);
function goHome(){
G.playing=false;G.pause=false;purgeFx();
 $('btnResume').style.display='none';
show('ovTitle');
updateTitleStats()}
function updateTitleStats(){
 $('titleStats').textContent='Lines '+(parseInt(store.get('bp_lines')||'0')||0)+' · Games '+(parseInt(store.get('bp_games')||'0')||0)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
/* — boutons — */
 $('btnPlay').addEventListener('click',()=>{SFX.init();MUSIC.init();SFX.up();startGame('classic')});
 $('btnAdv').addEventListener('click',()=>{SFX.init();MUSIC.init();SFX.up();buildLevels();show('ovLevels')});
 $('btnMapBack').addEventListener('click',()=>show('ovTitle'));
 $('btnWinMap').addEventListener('click',()=>{buildLevels();show('ovLevels')});
 $('btnFailMap').addEventListener('click',()=>{buildLevels();show('ovLevels')});
 $('btnNext').addEventListener('click',()=>{
if(G.lvl+1<LEVELS.length)startGame('adv',G.lvl+1);
else{toast('Aventure terminée ! 🏆');goHome()}});
 $('btnReplay').addEventListener('click',()=>startGame('adv',G.lvl));
 $('btnRetry').addEventListener('click',()=>startGame('adv',G.lvl));
 $('btnAgain').addEventListener('click',()=>startGame(G.mode==='adv'?'adv':'classic',G.lvl));
 $('btnMenu').addEventListener('click',goHome);
 $('btnPause').addEventListener('click',()=>{
if(!G.playing)return;
G.pause=true;
 $('pauseInfo').textContent='Score '+fmt(G.score)+' · Best '+fmt(G.best);
show('ovPause')});
 $('btnPClose').addEventListener('click',()=>{G.pause=false;hideAll()});
 $('btnPRestart').addEventListener('click',()=>startGame(G.mode,G.lvl));
 $('btnPHome').addEventListener('click',goHome);
 $('btnPMap').addEventListener('click',()=>{G.pause=false;buildLevels();show('ovLevels')});
 $('tglSound').addEventListener('click',function(){
SFX.on=!SFX.on;store.set('bp_snd',SFX.on?'1':'0');
this.classList.toggle('off',!SFX.on);SFX.pick()});
 $('tglMusic').addEventListener('click',function(){
MUSIC.on=!MUSIC.on;store.set('bp_music',MUSIC.on?'1':'0');
this.classList.toggle('off',!MUSIC.on);
if(MUSIC.on){SFX.init();MUSIC.start()}else MUSIC.stop()});
 $('tglVib').addEventListener('click',function(){
vibOn=!vibOn;store.set('bp_vib',vibOn?'1':'0');
this.classList.toggle('off',!vibOn);vib(20)});
 $('btnRevive').addEventListener('click',()=>{
show('ovAd');
let n=3;$('adTxt').textContent='Simulated ad… '+n;
const iv=setInterval(()=>{
n--;
if(n<=0){clearInterval(iv);hideAll();doRevive();return}
 $('adTxt').textContent='Simulated ad… '+n},1000)});
 $('btnAdSkip').addEventListener('click',()=>{hideAll();gameOver()});
function doRevive(){
G.revived=true;G.over=false;G.playing=true;G.pause=false;
let cleared=0;
for(let y=N-1;y>=0&&cleared<TUNE.reviveClearRows;y--){
let any=false;
for(let x=0;x<N;x++)if(G.grid[y][x])any=true;
if(any){cleared++;
const cells=[];
for(let x=0;x<N;x++){const c=G.grid[y][x];if(c)cells.push({x,y,ci:c.ci,gem:c.gem?1:0})}
const lines=[{d:'h',y,cells}];
lcAfter(cleared*140,()=>doClear(lines))}}
if(!cleared){toast('Rien à nettoyer !');gameOver()}}
/* — niveaux — */
function buildLevels(){
const gr=$('lvGrid');gr.innerHTML='';
 $('advProg').textContent=G.advc.filter(v2=>v2>0).length+' / '+LEVELS.length+' done';
LEVELS.forEach((L,i)=>{
const unlocked=i===0||(G.advc[i-1]||0)>0;
const b=document.createElement('button');
b.className='lvbtn'+(unlocked?'':' locked')+(G.advc[i]>0?' done':'');
b.innerHTML=(i+1)+'<span class="st">'+(G.advc[i]>0?'★'.repeat(G.advc[i]):(unlocked?'▶':'🔒'))+'</span>';
if(unlocked)b.addEventListener('click',()=>{SFX.up();startGame('adv',i)});
gr.appendChild(b)})}
/* — dev — */
let taps=0,tapT=0;
document.querySelector('.bigLogo').addEventListener('click',()=>{
const now=Date.now();
if(now-tapT>1200)taps=0;
tapT=now;taps++;
if(taps>=5){taps=0;
const d=$('btnDev');
d.style.display=d.style.display==='none'?'flex':'none';
if(d.style.display==='flex'){buildDevSelect();show('ovTitle');toast('Mode DEV activé')}}});
function buildDevSelect(){
const sel=$('devStyle');sel.innerHTML='';
STYLES.forEach((s,i)=>{
const o=document.createElement('option');
o.value=i;o.textContent=i+' — '+s.name+(G.unlocked[i]?'':' 🔒');
sel.appendChild(o)});
sel.value=G.style;
sel.onchange=()=>{setStyle(+sel.value)}}
 $('devM5').addEventListener('click',()=>{G.best=Math.max(0,G.best-5000);saveState();updateBestHUD();checkUnlocks()});
 $('devM1').addEventListener('click',()=>{G.best=Math.max(0,G.best-1000);saveState();updateBestHUD()});
 $('devP1').addEventListener('click',()=>{G.best+=1000;saveState();updateBestHUD();checkUnlocks()});
 $('devP5').addEventListener('click',()=>{G.best+=5000;saveState();updateBestHUD();checkUnlocks()});
 $('devUnlockAll').addEventListener('click',()=>{G.unlocked=STYLES.map(()=>true);saveState();toast('Tous les styles débloqués');buildDevSelect()});
 $('devPreview').addEventListener('click',()=>{
if(!G.playing){freshGrid();G.playing=true}
const y=Math.floor(Math.random()*N);
for(let x=0;x<N;x++)G.grid[y][x]={ci:x%8};
const lines=findLines();
if(lines.length){G.style=Math.floor(Math.random()*STYLES.length);buildBoardBG();doClear(lines)}
else toast('Ligne pleine introuvable')});
if(/dev/.test(location.search)||store.get('bp_dev')==='1'){$('btnDev').style.display='flex';buildDevSelect()}
/* ================= BOOT ================= */
function firstGesture(){
SFX.init();MUSIC.init();
window.removeEventListener('pointerdown',firstGesture)}
window.addEventListener('pointerdown',firstGesture);
async function boot(){
const fill=$('loadFill');
const steps=[8,22,40,60,80,100];
loadState();
freshGrid();
updateBestHUD();
 $('tglSound').classList.toggle('off',!SFX.on);
 $('tglMusic').classList.toggle('off',!MUSIC.on);
 $('tglVib').classList.toggle('off',!vibOn);
for(let i=0;i<steps.length;i++){
fill.style.width=steps[i]+'%';
await sleep(90)}
try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}
resize();
preheatAllStyles();
bindDrag();
requestAnimationFrame(frame);
await sleep(200);
window.__bpBooted=true;
updateTitleStats();
show('ovTitle');
G.mode='none';
setInterval(updateObjBar,500)}
boot().catch(e=>show(e.message));
})();
</script>
</body>
